name: CI and production deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Test and validate containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: gigamail-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GIGAMAIL_BIND_ADDRESS: 127.0.0.1
      GIGAMAIL_PORT: 3080
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests and build checks
        run: |
          npm test
          npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate deployment files
        run: |
          cp .env.example .env
          sh -n deploy/launch.sh
          sh -n deploy/production-deploy.sh
          docker compose --env-file .env --profile privacy config --quiet

      - name: Build application and privacy images
        run: docker compose --env-file .env --profile privacy build

      - name: Start the application image
        run: |
          REMOTE_CONTENT_PROXY_URL=http://tor-proxy:8118 \
            docker compose --env-file .env --profile privacy up --detach --no-build --wait --wait-timeout 180

      - name: Exercise health and authentication gates
        run: |
          health=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3080/api/health)
          printf '%s\n' "$health" | grep -q '"status":"ok"'
          printf '%s\n' "$health" | grep -q '"authProtected":true'
          printf '%s\n' "$health" | grep -q '"credentialsConfigured":true'
          printf '%s\n' "$health" | grep -q '"remoteContentProxyConfigured":true'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:3080/api/accounts)
          test "$status" = "401"

      - name: Remove ephemeral CI containers and volumes
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env --profile privacy down --volumes --timeout 15
          fi

  deploy:
    name: Recreate production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on:
      - self-hosted
      - linux
      - gigamail-prod
    timeout-minutes: 20
    environment:
      name: production
      url: https://mail.xer0.io
    env:
      DEPLOY_MODE: privacy
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Locate the protected production checkout
        shell: bash
        env:
          CONFIGURED_PRODUCTION_REPO: ${{ vars.PRODUCTION_REPO }}
        run: |
          set -euo pipefail
          actions_workspace=$(realpath -e "$GITHUB_WORKSPACE")
          actions_work_root=$(realpath -e "$actions_workspace/../..")
          matches=()

          consider_repository() {
            require_origin=$2
            repository=$(realpath -e "$1") || return 0
            case "$repository" in
              *$'\n'*|*$'\r'*)
                printf 'Repository paths must not contain line breaks.\n' >&2
                exit 1
                ;;
              "$actions_workspace"|"$actions_workspace"/*|"$actions_work_root"|"$actions_work_root"/*)
                return 0
                ;;
            esac

            [ -e "$repository/.git" ] || return 0
            [ -f "$repository/.env" ] || return 0
            [ -f "$repository/docker-compose.yml" ] || return 0
            [ -f "$repository/deploy/launch.sh" ] || return 0
            [ -f "$repository/package.json" ] || return 0

            if [ "$require_origin" = "1" ]; then
              origin=$(git -C "$repository" remote get-url origin 2>/dev/null || true)
              case "$origin" in
                https://github.com/nova-centauri/GigaMail|https://github.com/nova-centauri/GigaMail.git|git@github.com:nova-centauri/GigaMail|git@github.com:nova-centauri/GigaMail.git|ssh://git@github.com/nova-centauri/GigaMail|ssh://git@github.com/nova-centauri/GigaMail.git)
                  ;;
                *)
                  return 0
                  ;;
              esac
            fi

            for existing in "${matches[@]}"; do
              [ "$existing" = "$repository" ] && return 0
            done
            matches+=("$repository")
          }

          if [ -n "$CONFIGURED_PRODUCTION_REPO" ]; then
            consider_repository "$CONFIGURED_PRODUCTION_REPO" 0
          else
            compose_scan=$(mktemp "$RUNNER_TEMP/gigamail-compose-roots.XXXXXX")
            home_scan=$(mktemp "$RUNNER_TEMP/gigamail-checkouts.XXXXXX")
            trap 'rm -f "$compose_scan" "$home_scan"' EXIT

            if ! docker ps --all \
              --filter label=com.docker.compose.service=gigamail \
              --format '{{.Label "com.docker.compose.project.working_dir"}}' > "$compose_scan"; then
              printf 'Could not inspect the existing GigaMail Compose container.\n' >&2
              exit 1
            fi

            while IFS= read -r compose_root; do
              [ -n "$compose_root" ] || continue
              case "$compose_root" in
                *$'\r'*)
                  printf 'Compose working-directory labels must not contain carriage returns.\n' >&2
                  exit 1
                  ;;
              esac
              printf 'Inspecting Compose working directory: %s\n' "$compose_root"
              consider_repository "$compose_root" 0
            done < "$compose_scan"

            if [ "${#matches[@]}" -eq 0 ]; then
              if ! find "$HOME" -path "$actions_work_root" -prune -o \
                \( -type d -o -type f \) -name .git -print0 > "$home_scan"; then
                printf 'Could not safely scan for the persistent production checkout.\n' >&2
                exit 1
              fi

              while IFS= read -r -d '' git_entry; do
                consider_repository "${git_entry%/.git}" 1
              done < "$home_scan"
            fi
          fi

          if [ "${#matches[@]}" -ne 1 ]; then
            printf 'Expected exactly one persistent GigaMail checkout with a private .env; found %s.\n' "${#matches[@]}" >&2
            for repository in "${matches[@]}"; do
              printf 'Candidate: %s\n' "$repository" >&2
            done
            exit 1
          fi

          printf 'PRODUCTION_REPO=%s\n' "${matches[0]}" >> "$GITHUB_ENV"
          printf 'Using protected production checkout: %s\n' "${matches[0]}"

      - name: Deploy the exact tested commit
        run: sh deploy/production-deploy.sh "$GITHUB_SHA" "$PRODUCTION_REPO" "$DEPLOY_MODE" "$GITHUB_WORKSPACE"

  verify-public:
    name: Verify public HTTPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the public health endpoint
        run: |
          health=$(curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 120 \
            https://mail.xer0.io/api/health)
          printf '%s\n' "$health" | grep -q '"status":"ok"'
          printf '%s\n' "$health" | grep -q "\"releaseSha\":\"$GITHUB_SHA\""
